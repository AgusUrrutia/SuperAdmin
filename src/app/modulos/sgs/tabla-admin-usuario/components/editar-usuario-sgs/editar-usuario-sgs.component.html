<div class="crear-container">
    <div class="header-modal d-flex align-items-center mb-0">
        <mat-icon class="me-2 header-icon">edit</mat-icon>
        <h2 class="title mb-0">Editar Usuario SGS</h2>
        <button type="button" class="btn-close ms-auto" aria-label="Close" (click)="cancelar()"></button>
    </div>

    <div class="form-content">
        <div class="field">
            <label class="section-label">Email / Usuario</label>
            <input type="text" [(ngModel)]="mail" class="form-control" placeholder="Ingrese email">
        </div>
        <div class="field">
            <label class="section-label">Mail Personal *</label>
            <input type="email" [(ngModel)]="mailPersonal" class="form-control" placeholder="Ingrese mail personal">
        </div>

        <div class="field">
            <label class="section-label">Nombre</label>
            <input type="text" [(ngModel)]="nombre" class="form-control" placeholder="Ingrese nombre">
        </div>
        <div class="field">
            <label class="section-label">Apellido</label>
            <input type="text" [(ngModel)]="apellido" class="form-control" placeholder="Ingrese apellido">
        </div>

        <div class="field">
            <label class="section-label">GP Customer (GP_CUSTNMBR)</label>
            <input type="text" [(ngModel)]="gpCustnmbr" class="form-control" placeholder="Ingrese código GP">
        </div>
        
        <div class="field mb-3">
            <label class="section-label">Aplicaciones *</label>
            <div class="d-flex gap-2">
                <select class="form-control form-select" [(ngModel)]="aplicacionActual" [disabled]="!aplicaciones.length || estaModificandoApp">
                    <option [ngValue]="null" disabled selected>-- Seleccione una aplicación --</option>
                    <option *ngFor="let app of aplicaciones" [ngValue]="app">{{ app.SISTEMA || app.nombre || app.NOMBRE }}</option>
                </select>
                <button type="button" class="btn btn-dark-custom btn-sm px-3" (click)="agregarAplicacion()" [disabled]="estaModificandoApp">
                    <mat-icon *ngIf="!estaModificandoApp" style="font-size: 18px; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;">add</mat-icon>
                    <span *ngIf="estaModificandoApp" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                </button>
            </div>

            <div *ngIf="aplicacionesSeleccionadas.length > 0" class="badges-container d-flex flex-wrap gap-2 mt-2">
                <span *ngFor="let appSel of aplicacionesSeleccionadas" class="badge border bg-light text-dark d-flex align-items-center px-3 py-2" [ngClass]="{'opacity-50': estaModificandoApp}" style="font-size: 0.85rem; border-radius: 20px;">
                    {{ appSel.SISTEMA || appSel.nombre || appSel.NOMBRE }}
                    <mat-icon class="ms-2 text-danger" style="cursor: pointer; font-size: 18px; width: 18px; height: 18px;" 
                        (click)="!estaModificandoApp && eliminarAplicacion(appSel)">close</mat-icon>
                </span>
            </div>
            <div *ngIf="aplicacionesSeleccionadas.length === 0" class="mt-2 text-muted" style="font-size: 0.85rem;">
                No ha añadido aplicaciones.
            </div>
        </div>

    </div>

    <div class="actions-modal p-3 d-flex justify-content-between align-items-center bg-white border-top">
        <div>
            @if(activo === '1') {
            <button type="button" class="btn-status" (click)="toggleActivo()">Deshabilitar Cuenta</button>
            } @else {
            <button type="button" class="btn-status btn-success" (click)="toggleActivo()">Habilitar Cuenta</button>
            }
        </div>
        <button (click)="guardar()" class="btn-save" [disabled]="estaCargando">
            <span *ngIf="!estaCargando">Guardar Cambios</span>
            <span *ngIf="estaCargando">Procesando...</span>
        </button>
    </div>
</div>
