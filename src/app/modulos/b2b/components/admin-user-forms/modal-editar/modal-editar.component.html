<div class="crear-container">
    <div class="header-modal d-flex align-items-center mb-0">
        <mat-icon class="me-2 header-icon">edit</mat-icon>
        <h2 class="title mb-0">Editar Usuario</h2>
        <button type="button" class="btn-close ms-auto" aria-label="Close" (click)="onCancelar()"></button>
    </div>

    <form #form="ngForm" (ngSubmit)="guardar()">
        <div class="form-content">
            <h5 class="mb-3 text-muted" style="font-size: 0.95rem; font-weight: 600;">Datos Personales</h5>
            <div class="row mb-3">
                <div class="col-6 field">
                    <label class="section-label">Nombre <span class="text-danger">*</span></label>
                    <input type="text" name="nombre" class="form-control" [(ngModel)]="usuario.NOMBRE" required />
                </div>
                <div class="col-6 field">
                    <label class="section-label">Apellido <span class="text-danger">*</span></label>
                    <input type="text" name="apellido" class="form-control" [(ngModel)]="usuario.APELLIDO" required />
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-6 field">
                    <label class="section-label">Email / Usuario</label>
                    <input type="text" name="mail" class="form-control" [(ngModel)]="usuario.MAIL" />
                </div>
                <div class="col-6 field">
                    <label class="section-label">Email Personal</label>
                    <input type="email" name="mailPersonal" class="form-control" [(ngModel)]="usuario.MAIL_PERSONAL" />
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-12 field">
                    <label class="section-label">Código Cliente GP <span class="text-danger">*</span></label>
                    <input type="text" name="gpCustnmbr" class="form-control" [(ngModel)]="usuario.GP_CUSTNMBR" required />
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-12 field">
                    <label class="section-label">Aplicaciones <span class="text-danger">*</span></label>
                    <div class="d-flex gap-2">
                        <select name="aplicacionActual" class="form-control form-select" [(ngModel)]="aplicacionActual" [disabled]="!aplicaciones.length || estaModificandoApp">
                            <option [ngValue]="null" disabled selected>-- Seleccione una aplicación --</option>
                            <option *ngFor="let app of aplicaciones" [ngValue]="app">{{ app.SISTEMA || app.nombre || app.NOMBRE }}</option>
                        </select>
                        <button type="button" class="btn btn-dark btn-sm px-3" (click)="agregarAplicacion()" [disabled]="estaModificandoApp">
                            <mat-icon *ngIf="!estaModificandoApp" style="font-size: 18px; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;">add</mat-icon>
                            <span *ngIf="estaModificandoApp" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                        </button>
                    </div>

                    <div *ngIf="aplicacionesSeleccionadas.length > 0" class="badges-container d-flex flex-wrap gap-2 mt-2">
                        <span *ngFor="let appSel of aplicacionesSeleccionadas" class="badge border bg-light text-dark d-flex align-items-center px-3 py-2" [ngClass]="{'opacity-50': estaModificandoApp}" style="font-size: 0.85rem; border-radius: 20px; font-weight: normal;">
                            {{ appSel.SISTEMA || appSel.nombre || appSel.NOMBRE }}
                            <mat-icon class="ms-2 text-danger" style="cursor: pointer; font-size: 18px; width: 18px; height: 18px;" 
                                (click)="!estaModificandoApp && eliminarAplicacion(appSel)">close</mat-icon>
                        </span>
                    </div>
                    <div *ngIf="aplicacionesSeleccionadas.length === 0" class="mt-2 text-muted" style="font-size: 0.85rem;">
                        No ha añadido aplicaciones.
                    </div>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-6 field">
                    <label class="section-label">Teléfono</label>
                    <input type="text" name="telefono" class="form-control bg-light" [(ngModel)]="usuario.TELEFONO1" disabled="true" />
                </div>
                <div class="col-6 field">
                    <label class="section-label">Razón Social</label>
                    <input type="text" name="razonSocial" class="form-control bg-light" [(ngModel)]="usuario.RAZONSOCIAL" disabled="true" />
                </div>
            </div>
            <div class="row">
                <div class="col-12 field">
                    <label class="section-label">Domicilio</label>
                    <input type="text" name="domicilio" class="form-control bg-light" [(ngModel)]="usuario.DOMICILIO" disabled="true" />
                </div>
            </div>
        </div>
    </form>

    <div class="actions-modal p-3 d-flex justify-content-between align-items-center bg-white border-top mt-0">
        <div>
            @if(usuario.ACTIVO === "1") {
                <button type="button" class="btn-status" (click)="changeActivo()">Deshabilitar Usuario</button>
            } @else {
                <button type="button" class="btn-status btn-success" (click)="changeActivo()">Habilitar Usuario</button>
            }
        </div>
        <div>
            <button (click)="guardar()" class="btn-save" [disabled]="form.invalid">Guardar Cambios</button>
        </div>
    </div>
</div>
