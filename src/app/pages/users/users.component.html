<div class="container-fluid mt-3">
  <div class="d-flex justify-content-center mb-4">
    <h4 class="fw-semibold mb-0" style="color: #333;">Administración de Usuarios</h4>
  </div>

  <div class="card shadow-sm border-0 rounded-3">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-sm table-hover align-middle mb-0 text-nowrap" style="font-size: 0.85rem;">
          <thead class="table-light">
            <tr>
              <th scope="col" class="py-2 px-3 fw-bold text-start" style="color: #495057;">ID / Nombre</th>
              <th scope="col" class="py-2 px-3 fw-bold text-start" style="color: #495057;">Correo</th>
              <th scope="col" class="py-2 px-3 fw-bold text-start" style="color: #495057;">Rol del Usuario</th>
              <th scope="col" class="py-2 px-3 fw-bold text-start" style="color: #495057;">Estado</th>
              <th scope="col" class="py-2 px-3 fw-bold text-start" style="color: #495057;">Última Conexión</th>
              <th scope="col" class="py-2 px-3 fw-bold text-start" style="color: #495057;">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <!-- Row 1 -->
            <tr>
              <td class="py-2 px-3">
                <div class="d-flex align-items-center justify-content-start">

                  <div class="text-start">
                    <span class="fw-semibold text-dark me-2">John Doe</span>
                    <span class="text-muted" style="font-size: 0.75rem;">#001</span>
                  </div>
                </div>
              </td>
              <td class="py-2 px-3 text-start text-muted">admin&#64;ranko.com</td>
              <td class="py-2 px-3 text-start"><span class="badge bg-dark text-white fw-normal">SuperAdmin</span></td>
              <td class="py-2 px-3 text-start"><span
                  class="badge bg-success-subtle text-success border border-success border-opacity-25 fw-normal rounded-pill">Activo</span>
              </td>
              <td class="py-2 px-3 text-start text-muted" style="font-size: 0.8rem;">Hace 2 horas</td>
              <td class="py-2 px-3 text-start">
                <button class="btn btn-outline-primary py-0 px-2 rounded-1 fw-medium me-1 text-center"
                  style="font-size: 0.75rem; height: 22px; line-height: 1; width: 65px;">Editar</button>
                <button class="btn btn-outline-danger py-0 px-2 rounded-1 fw-medium text-center"
                  style="font-size: 0.75rem; height: 22px; line-height: 1; width: 65px;">Eliminar</button>
              </td>
            </tr>

            <!-- Row 2 -->
            <tr>
              <td class="py-2 px-3">
                <div class="d-flex align-items-center justify-content-start">

                  <div class="text-start">
                    <span class="fw-semibold text-dark me-2">Jane Smith</span>
                    <span class="text-muted" style="font-size: 0.75rem;">#002</span>
                  </div>
                </div>
              </td>
              <td class="py-2 px-3 text-start text-muted">user&#64;ranko.com</td>
              <td class="py-2 px-3 text-start"><span class="badge bg-secondary text-white fw-normal">Soporte</span>
              </td>
              <td class="py-2 px-3 text-start"><span
                  class="badge bg-success-subtle text-success border border-success border-opacity-25 fw-normal rounded-pill">Activo</span>
              </td>
              <td class="py-2 px-3 text-start text-muted" style="font-size: 0.8rem;">Ayer</td>
              <td class="py-2 px-3 text-start">
                <button class="btn btn-outline-primary py-0 px-2 rounded-1 fw-medium me-1 text-center"
                  style="font-size: 0.75rem; height: 22px; line-height: 1; width: 65px;">Editar</button>
                <button class="btn btn-outline-danger py-0 px-2 rounded-1 fw-medium text-center"
                  style="font-size: 0.75rem; height: 22px; line-height: 1; width: 65px;">Eliminar</button>
              </td>
            </tr>

            <!-- Row 3 -->
            <tr>
              <td class="py-2 px-3 border-bottom-0">
                <div class="d-flex align-items-center justify-content-start">

                  <div class="text-start">
                    <span class="fw-semibold text-dark me-2">Mario Ruiz</span>
                    <span class="text-muted" style="font-size: 0.75rem;">#003</span>
                  </div>
                </div>
              </td>
              <td class="py-2 px-3 text-start text-muted border-bottom-0">mario.rz&#64;ranko.com</td>
              <td class="py-2 px-3 text-start border-bottom-0"><span
                  class="badge bg-secondary text-white fw-normal">Ventas</span></td>
              <td class="py-2 px-3 text-start border-bottom-0"><span
                  class="badge bg-danger-subtle text-danger border border-danger border-opacity-25 fw-normal rounded-pill">Inactivo</span>
              </td>
              <td class="py-2 px-3 text-start text-muted border-bottom-0" style="font-size: 0.8rem;">Hace 2 semanas
              </td>
              <td class="py-2 px-3 text-start border-bottom-0">
                <button class="btn btn-outline-primary py-0 px-2 rounded-1 fw-medium me-1 text-center"
                  style="font-size: 0.75rem; height: 22px; line-height: 1; width: 65px;">Editar</button>
                <button class="btn btn-outline-danger py-0 px-2 rounded-1 fw-medium text-center"
                  style="font-size: 0.75rem; height: 22px; line-height: 1; width: 65px;">Eliminar</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
