<div class="login-page">
  <div class="login-card">

    <div class="login-left">
      <img src="assets/Logo_EK_RANKO.svg" alt="Logo" class="logo">
      <h1 class="welcome-text">Bienvenido!</h1>
    </div>

    <div class="login-right">
      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="usuario">Usuario</label>
          <input id="usuario" type="text" class="input-field" [(ngModel)]="username" name="username">
        </div>

        <div class="form-group">
          <label for="contrasena">Contraseña</label>
          <input id="contrasena" type="password" class="input-field" [(ngModel)]="password" name="password">
        </div>

        <div class="forgot-link-container">
          <a href="#" class="forgot-password">Olvidaste tu contraseña?</a>
        </div>

        <div class="button-container">
          <button type="submit" class="login-button">Ingresar ></button>
        </div>
      </form>
    </div>

  </div>

  <div class="version-text">version 1 . 0 . 25</div>
</div>
