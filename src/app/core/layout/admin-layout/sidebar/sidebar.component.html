<div class="d-flex flex-column h-100 p-3" style="background-color: #1a1e23;">
  <!-- Branding Area -->
  <div class="d-flex align-items-center justify-content-between mb-4 border-bottom pb-3 border-secondary">
    <a href="/" class="d-flex align-items-center text-white text-decoration-none">
      <span class="fs-4 fw-semibold me-2">SuperAdmin</span>
    </a>

    <!-- Close Button -->
    <button (click)="onClose()" type="button"
      class="btn btn-outline-secondary border-0 btn-sm p-1 d-flex align-items-center justify-content-center text-white"
      style="width: 32px; height: 32px;">
      <span class="fw-bold" style="font-size: 1.2rem; line-height: 1;">&times;</span>
    </button>
  </div>

  <!-- Navigation -->
  <ul class="nav nav-pills flex-column mb-auto">
    <!-- Categories Collapse (No White Frame) -->
    <li class="nav-item mb-1">
      <button class="nav-link text-white w-100 text-start d-flex align-items-center justify-content-between px-2"
        type="button" data-bs-toggle="collapse" data-bs-target="#categoriesCollapse" aria-expanded="true"
        style="color: #cccccc !important;">
        Apps
        <span class="dropdown-toggle"></span>
      </button>
      <div class="collapse show w-100 mt-1" id="categoriesCollapse">
        <ul class="nav flex-column ps-3 py-1" style="font-size: 0.95rem;">
          <li class="nav-item w-100">
            <button
              class="nav-link py-2 px-2 text-white-50 w-100 text-start d-flex align-items-center justify-content-between rounded-1 border-0 bg-transparent"
              type="button" data-bs-toggle="collapse" data-bs-target="#sgsCollapse" aria-expanded="false">
              SGS
              <span class="dropdown-toggle"></span>
            </button>
            <div class="collapse w-100 mt-1 ps-2" [class.show]="isSgsActive()" id="sgsCollapse">
              <ul class="nav flex-column ps-3 py-1" style="font-size: 0.9rem;">
                <li class="nav-item w-100">
                  <a class="nav-link py-1 px-2 text-white-50 w-100 rounded-1 text-decoration-none"
                    routerLink="/sgs/grupos" routerLinkActive="active">Grupos</a>
                </li>
                <li class="nav-item w-100">
                  <a class="nav-link py-1 px-2 text-white-50 w-100 rounded-1 text-decoration-none"
                    routerLink="/sgs/usuarios" routerLinkActive="active">Usuarios</a>
                </li>
              </ul>
            </div>
          </li>
          <li class="nav-item w-100">
            <button
              class="nav-link py-2 px-2 text-white-50 w-100 text-start d-flex align-items-center justify-content-between rounded-1 border-0 bg-transparent"
              type="button" data-bs-toggle="collapse" data-bs-target="#b2bCollapse" aria-expanded="false">
              B2B
              <span class="dropdown-toggle"></span>
            </button>
            <div class="collapse w-100 mt-1 ps-2" [class.show]="isB2bActive()" id="b2bCollapse">
              <ul class="nav flex-column ps-3 py-1" style="font-size: 0.9rem;">
                <li class="nav-item w-100">
                  <a class="nav-link py-1 px-2 text-white-50 w-100 rounded-1 text-decoration-none"
                    routerLink="/b2b/usuarios" routerLinkActive="active">Usuarios</a>
                </li>
              </ul>
            </div>
          </li>
          <li class="nav-item w-100">
            <button
              class="nav-link py-2 px-2 text-white-50 w-100 text-start d-flex align-items-center justify-content-between rounded-1 border-0 bg-transparent"
              type="button" data-bs-toggle="collapse" data-bs-target="#adCollapse" aria-expanded="false">
              AD
              <span class="dropdown-toggle"></span>
            </button>
            <div class="collapse w-100 mt-1 ps-2" [class.show]="isAdActive()" id="adCollapse">
              <ul class="nav flex-column ps-3 py-1" style="font-size: 0.9rem;">
                <li class="nav-item w-100">
                  <a class="nav-link py-1 px-2 text-white-50 w-100 rounded-1 text-decoration-none sidebar-sublink"
                    routerLink="/ad/usuarios" routerLinkActive="active">Usuarios</a>
                </li>
                <li class="nav-item w-100">
                  <a class="nav-link py-1 px-2 text-white-50 w-100 rounded-1 text-decoration-none sidebar-sublink"
                    routerLink="/ad/historial" routerLinkActive="active">Historial de Acciones</a>
                </li>
              </ul>
            </div>
          </li>

        </ul>
      </div>
    </li>


  </ul>

  <!-- EK Footer Logo -->
  <div class="mt-auto d-flex justify-content-center pt-4">
    <div class="d-flex align-items-end" style="line-height: 1;">
      <span class="fw-bold text-white mb-0"
        style="font-size: 2.2rem; margin-right: -2px; letter-spacing: -1px;">e</span>
      <span class="fw-bold text-danger mb-0" style="font-size: 2.2rem; letter-spacing: -2px;">K</span>
    </div>
  </div>
</div>
