<nav class="navbar navbar-expand-lg border-bottom" style="background-color: #1a1e23; border-color: #2b3035 !important;">
  <div class="container-fluid d-flex justify-content-between align-items-center">

    <!-- Left side (Hamburger button when sidebar is hidden) -->
    <div class="d-flex align-items-center">
      @if (isSidebarHidden) {
      <button (click)="onToggleSidebar()" class="btn btn-outline-light btn-sm me-3 border-0">
        <span style="font-size: 1.2rem; font-weight: bold;">&#9776;</span>
      </button>
      <span class="text-white fw-semibold fs-5">SuperAdmin</span>
      }
    </div>

    <!-- Right side Content -->
    <ul class="navbar-nav flex-row align-items-center mb-0">
      <!-- User Profile Dropdown -->
      <li class="nav-item dropdown">
        <a class="nav-link text-white d-flex align-items-center dropdown-toggle border-0" href="#" id="userDropdown"
          role="button" data-bs-toggle="dropdown" aria-expanded="false">
          <div class="rounded-circle d-flex align-items-center justify-content-center text-dark fw-bold me-2"
            style="width: 32px; height: 32px; background-color: #ffb74d;">
            <span class="material-icons" style="font-size: 1.2rem;">person_outline</span>
          </div>
          <span>{{ username }}</span>
        </a>
        <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2 rounded-3" aria-labelledby="userDropdown"
          style="min-width: 220px;">
          <li class="px-3 py-2 text-dark fs-6" style="margin-bottom: -0.5rem;">{{ username }}</li>
          <li>
            <hr class="dropdown-divider my-2">
          </li>
          <li><a class="dropdown-item py-2" (click)="logout()" style="cursor: pointer; font-size: 0.95rem;">Cerrar
              Sesión</a></li>
        </ul>
      </li>

      <!-- App Switcher Dropdown -->
      <li class="nav-item dropdown ms-2">
        <a class="nav-link text-white d-flex align-items-center" href="#" id="appsDropdown" role="button"
          data-bs-toggle="dropdown" aria-expanded="false" style="padding: 0.5rem;">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="#cccccc" class="bi bi-grid-3x3-gap-fill"
            viewBox="0 0 16 16">
            <path
              d="M1 2a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1zm5 0a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1zm5 0a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1zM1 7a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1zm5 0a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1zm5 0a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1zM1 12a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1zm5 0a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1zm5 0a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1z" />
          </svg>
        </a>
        <ul class="dropdown-menu dropdown-menu-end shadow border-0 p-2 rounded-3" aria-labelledby="appsDropdown"
          style="width: 330px;">
          <li>
            <div class="apps-grid">
              <!-- Apps de ek-apps-menu permitidas al usuario: logo, nombre y link vienen de la API -->
              @for (app of apps; track app.id_sistema) {
              <!-- El link lleva el token (#sso=) para entrar sin volver a loguearse -->
              <a [href]="linkConSso(app.link)" [target]="app.extras?.abrir_en_nueva_pestana ? '_blank' : '_self'"
                rel="noopener" [title]="app.extras?.descripcion || app.app_name"
                class="text-decoration-none text-center d-flex flex-column align-items-center p-2 rounded hover-bg-light"
                style="transition: background-color 0.2s;">
                @if (app.image) {
                <img class="app-logo mb-1" [src]="app.image" [alt]="app.app_name" />
                } @else {
                <!-- Icono generico cuando la app no tiene logo -->
                <svg class="app-logo-generico mb-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                  <rect x="3" y="3" width="7" height="7" rx="1.5" /><rect x="14" y="3" width="7" height="7" rx="1.5" />
                  <rect x="3" y="14" width="7" height="7" rx="1.5" /><rect x="14" y="14" width="7" height="7" rx="1.5" />
                </svg>
                }
                <small class="text-dark fw-medium app-name">{{ app.app_name }}</small>
              </a>
              }
            </div>
          </li>
        </ul>
      </li>
    </ul>
  </div>
</nav>
